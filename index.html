<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An independent game studio creating games for mobile and PC.">
  <title>Independent Game Studio</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/visual-styles.css">
  <link href="3rd_party/bootstrap/bootstrap.min.css" rel="stylesheet">
  <script src="3rd_party/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/theme-config.js"></script>
  <script src="js/site-content.js"></script>
  <script src="js/visual-layouts.js"></script>
  <script src="js/visual-renderer.js"></script>
</head>
<body class="min-vh-100 d-flex flex-column">
  <a class="visually-hidden-focusable position-fixed z-3 m-2 btn btn-light" href="#games">Skip to games</a>

  <nav class="navbar navbar-expand border-bottom px-3 px-lg-5 py-3">
    <div class="container-fluid px-0">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#games" data-brand></a>
      <button class="navbar-toggler d-block border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#companyInfo" aria-controls="companyInfo" aria-expanded="false" aria-label="Toggle company information">
        <span class="small text-uppercase me-2 d-none d-sm-inline">BitMoksha</span><span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <section class="collapse border-bottom" id="companyInfo">
    <div class="container-fluid px-4 px-lg-5 py-4" data-company-info></div>
  </section>

  <main id="games" class="container-fluid flex-grow-1 d-flex px-0">
    <div class="row g-0 flex-grow-1 w-100">
      <section class="col-lg-8 border-end visual-pane" aria-label="Game screenshots">
        <div id="screenshots" class="carousel slide h-100" data-bs-interval="false">
          <div class="carousel-inner h-100" data-slides></div>
          <div class="position-absolute top-0 start-0 m-3 badge rounded-pill text-bg-dark"><span data-current>1</span> / <span data-total>1</span></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#screenshots" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span><span class="visually-hidden">Previous screenshot</span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#screenshots" data-bs-slide="next"><span class="carousel-control-next-icon"></span><span class="visually-hidden">Next screenshot</span></button>
        </div>
      </section>

      <section class="col-lg-4 d-flex flex-column info-pane" aria-live="polite">
        <div class="p-4 p-xl-5 my-auto" data-game-info></div>
        <!-- <div class="list-group list-group-horizontal rounded-0" role="tablist" aria-label="Choose a game" data-game-tabs></div> -->
        <div class="game-tabs list-group list-group-horizontal rounded-0" role="tablist" aria-label="Choose a game" data-game-tabs></div>
      </section>
    </div>
  </main>

  <footer class="container-fluid border-top px-3 px-lg-5 py-2 d-flex flex-wrap justify-content-between gap-2 small text-body-secondary">
    <span data-tagline></span><a class="link-secondary" data-email></a><span>&copy; <span data-year></span> <span data-company-name></span></span>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
